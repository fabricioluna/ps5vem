# Configuração do monitor de ofertas. Tudo aqui pode ser editado sem mexer no código.

produto:
  nome: "PS5 Slim Digital"
  # TODAS precisam aparecer no título (sem diferenciar maiúsculas/acentos).
  # Uma lista entre colchetes dentro da lista = basta UMA das opções.
  # Para aceitar só o pacote com Astro Bot, acrescente: "astro bot"
  palavras_obrigatorias:
    - "digital"
    - ["ps5", "playstation 5", "playstation5"]
  # NENHUMA pode aparecer no título (palavra inteira). "sem disco"/"sem leitor de disco" é ignorado,
  # e "controle" só conta quando o anúncio começa por ele (console que vem com controle passa).
  palavras_proibidas:
    - "usado"
    - "seminovo"
    - "recondicionado"
    - "open box"
    - "vitrine"
    - "controle"
    - "disco"
    - "pro"
    - "capa"
    - "skin"
    - "headset"
  preco_minimo_valido: 1500   # abaixo disso é golpe ou erro de leitura

alerta_normal:
  # preço máximo por faixa de horário (horário do fuso_horario abaixo)
  faixas:
    - { das: "00:00", ate: "23:59", preco_max: 4000 }
  exigir_sem_juros: false
  parcelas_minimas: 10       # só avisa se der para parcelar em 10x ou mais
  # Promobit e Pelando quase nunca informam o parcelamento. true = avisa mesmo assim
  # (a mensagem diz "parcelamento não informado"); false = ignora essas ofertas.
  aceitar_parcelamento_nao_informado: true

alerta_especial:
  preco_max: 3700            # super promoção
  queda_percentual: 20       # ou queda de 20% sobre a média recente
  janela_media_dias: 7       # dias usados para calcular a média recente
  prioridade: urgente
  # relâmpago: se a oferta aparecer nova e tiver desconto grande,
  # avisar na hora mesmo que seja de fonte única
  repetir_a_cada_minutos: 30 # reenvia enquanto a oferta continuar ativa

anti_spam:
  nao_repetir_mesma_oferta_por_minutos: 180
  avisar_so_se_preco_cair_mais: 50   # reais, para reenviar a mesma oferta

periodo:
  inicio: "2026-11-19"
  fim: "2026-11-30"

fuso_horario: "America/Fortaleza"

notificacao:
  canal: ntfy          # ntfy ou telegram
  ntfy_servidor: "https://ntfy.sh"
  # o tópico vem do secret NTFY_TOPIC; o Telegram usa TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID

fontes:
  # Cada fonte pode ser ligada/desligada. A url pode ser trocada se o site mudar.
  promobit:
    ativo: true
    url: "https://www.promobit.com.br/promocoes/playstation-5/s/"
  pelando:
    # bloqueia os servidores do GitHub Actions (HTTP 403); funciona rodando no seu computador
    ativo: true
    url: "https://www.pelando.com.br/busca/ps5-slim-digital"
  zoom:
    ativo: true
    url: "https://www.zoom.com.br/busca/playstation+5+slim+digital"
  buscape:
    ativo: true
    url: "https://www.buscape.com.br/busca/playstation+5+slim+digital"
  kabum:
    ativo: true
    url: "https://www.kabum.com.br/busca/ps5-slim-digital"
  # Promobit/Pelando: ignora posts mais antigos que isso (oferta provavelmente acabou)
  idade_maxima_horas: 48
  # após N falhas seguidas de uma fonte, manda um único aviso de manutenção
  falhas_para_aviso_manutencao: 6
