name: Monitor PS5

on:
  schedule:
    # a cada 10 minutos (o GitHub pode atrasar ou pular execuções em horários de pico)
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# impede duas execuções ao mesmo tempo (a próxima espera a atual terminar)
concurrency:
  group: monitor-ps5
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commitar histórico se mudou
        if: always()
        run: |
          if git diff --quiet -- data/history.json; then
            echo "Histórico sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "chore: atualiza histórico [skip ci]"
          git push || (git pull --rebase && git push)
